name: CatBudget

options:
  bundleIdPrefix: com.assessment
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CatBudget:
    type: application
    platform: iOS
    sources:
      - path: Sources/CatBudget
      - path: Fixtures
        buildPhase: resources
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: CatBudget
        CAT_API_KEY: $(CAT_API_KEY)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assessment.CatBudget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO

  CatBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CatBudgetTests
    dependencies:
      - target: CatBudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assessment.CatBudgetTests
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CatBudget:
    build:
      targets:
        CatBudget: all
        CatBudgetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CatBudgetTests
